syntax = "proto3";

package level.v1;

option go_package = "github.com/ilkol/chinese-game-backend/api/gen/level/v1;levelv1";

service LevelService {
    rpc GetLevels(GetLevelsRequest) returns (GetLevelsResponse);
    
    rpc GetLevelByID(GetLevelByIDRequest) returns (GetLevelByIDResponse);
}

message GetLevelsRequest {}

message GetLevelsResponse {
    repeated Level levels = 1;
}

message GetLevelByIDRequest {
    int64 id = 1;
    int64 user_id = 2;
}

message GetLevelByIDResponse {
    Level level = 1;
    repeated Step steps = 2;
}

message Level {
    int64 id = 1;
    string title = 2;
    string color = 3;
    string icon = 4;
    int32 order = 5;
    string background_src = 6;
    string planet_img_src = 7;
    string created_at = 8;
}

message Step {
    int64 id = 1;
    int64 level_id = 2;
    string type = 3;
    string title = 4;
    int32 order = 5;
    string content = 6;
    bool is_completed = 7;
    string description = 8;
    repeated DialogItem dialog = 9;
}

message DialogItem {
    string speaker = 1;
    string text = 2;
    string emotion = 3;
    string bg = 4;
}