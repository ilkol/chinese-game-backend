services:
  db:
    image: postgres:15-alpine
    container_name: chinese_game_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rest-server:
    build: 
      context: .
      dockerfile: Dockerfile.main
    container_name: chinese_game_api
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
      GOCACHE: /go-cache
      GOMODCACHE: /go-mod-cache
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  level-service:
    build: 
      context: .
      dockerfile: Dockerfile.level
    container_name: chinese_game_level_service
    ports:
      - "50051:50051"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: 5432
      GOCACHE: /go-cache
      GOMODCACHE: /go-mod-cache
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data: